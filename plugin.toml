[plugin]
name = "mr_windows_shield"
label = "🛡️ Mr. Windows Shield"
description = "Ловит Linux-активность и ведёт Индекс Доркина: репорты, тест в личке, наблюдение за чатом"
version = "1.6.0"
author = "Uto4ka404"

[runtime]
entry = "mr_windows_shield.main:create_plugin"
python = ">=3.14"
potehinsonnet = ">=0.21,<1.0"

[permissions]
# Тревоги в канал; опрос в личку и погашенные кнопки опроса; /dorkin; страница в панели
discord = ["send_message", "edit_message", "direct_message"]
commands = true
panel = true

[settings.linux_words]
label = "Слова Linux-активности"
description = "Ловит Linux-активность и ведёт Индекс Доркина: репорты, тест в личке, наблюдение за чатом"
default = "linux"

[settings.watch_airfryer]
label = "Наблюдение: слова про аэрогриль"
description = "Ловит Linux-активность и ведёт Индекс Доркина: репорты, тест в личке, наблюдение за чатом"
default = "аэрогрил, аэрофритюр, airfryer, air fryer"

[settings.watch_warthunder]
label = "Наблюдение: слова про War Thunder"
default = "вартандер, вар тандер, war thunder, warthunder, тундр, wt, танк, ангар"

[settings.watch_women]
label = "Наблюдение: слова про женщин"
default = "женщин, девушк, девочк, тян, тянк, тяночк, баба, бабы, бабу, бабе, бабам, телк"

[settings.events_warthunder]
label = "События: новости War Thunder"
type = "bool"
default = true

[settings.events_wiki]
label = "События: «Текущие события» Википедии"
type = "bool"
default = true

[settings.events_holiday]
label = "События: праздники РФ"
type = "bool"
default = true

[settings.events_news]
label = "События: новости мира (RSS)"
type = "bool"
default = true

[settings.news_feeds]
label = "Ленты новостей мира (RSS)"
description = "Адреса RSS через запятую; с каждой ленты — до 5 новостей в день"
default = "https://rssexport.rbc.ru/rbcnews/news/30/full.rss, https://lenta.ru/rss/news/world, https://ria.ru/export/rss2/world/index.xml, https://tass.ru/rss/v2.xml, https://www.interfax.ru/rss.asp"
