[project]
name = "mr-windows-shield"
version = "1.10.1"
description = "Ловит Linux-активность и ведёт Индекс Доркина: репорты, тест в личке, наблюдение за чатом"
authors = [
    {name = "azhestkov"}
]
requires-python = ">=3.14"
dependencies = [
    "potehinsonnet (>=0.21,<1.0)",
    "matplotlib (>=3.10,<4.0)",
    "httpx (>=0.28,<1.0)",
]

[dependency-groups]
dev = ["pytest (>=8)", "pytest-asyncio (>=1.0)"]

[tool.poetry]
packages = [{ include = "mr_windows_shield" }]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
